# ==========================================
# 销帮帮 CRM 官网 — GitHub Actions 部署流水线
# ==========================================
# 触发规则：
#   develop 分支 → 自动构建 + 部署测试环境
#   main 分支   → 手动触发 + 部署生产环境
# ==========================================
# 镜像策略：
#   构建阶段 → 双推 ghcr.io（层缓存） + ACR（国内拉取）
#   部署阶段 → 测试服务器从 ACR 拉取（国内网络秒级）
# ==========================================

name: Deploy

on:
  push:
    branches: [develop, main]
  workflow_dispatch:

env:
  GHCR_REGISTRY: ghcr.io
  IMAGE_NAME_BACKEND: ${{ github.repository }}/xbb-backend
  IMAGE_NAME_FRONTEND: ${{ github.repository }}/xbb-frontend

jobs:
  # ==========================================
  # 构建后端镜像 → 双推 ghcr.io + ACR
  # ==========================================
  build-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: 登录 ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 登录阿里云 ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: 设置 BuildKit
        uses: docker/setup-buildx-action@v3

      - name: 构建并推送后端镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: my-nest-app/Dockerfile
          push: true
          tags: |
            ${{ env.GHCR_REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}:${{ github.sha }}
            ${{ env.GHCR_REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}:latest
            ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/xbb-backend:${{ github.sha }}
            ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/xbb-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================================
  # 构建前端镜像 → 双推 ghcr.io + ACR
  # ==========================================
  build-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: 登录 ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 登录阿里云 ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: 设置 BuildKit
        uses: docker/setup-buildx-action@v3

      - name: 构建并推送前端镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: my-vue-app/Dockerfile
          push: true
          build-args: |
            VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}
          tags: |
            ${{ env.GHCR_REGISTRY }}/${{ env.IMAGE_NAME_FRONTEND }}:${{ github.sha }}
            ${{ env.GHCR_REGISTRY }}/${{ env.IMAGE_NAME_FRONTEND }}:latest
            ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/xbb-frontend:${{ github.sha }}
            ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/xbb-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================================
  # 部署测试环境（develop 分支 → 自动触发）
  # 测试服务器从 ACR 拉取镜像（国内网络）
  # ==========================================
  deploy-test:
    if: github.ref == 'refs/heads/develop'
    needs: [build-backend, build-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: SSH 部署到测试服务器
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.TEST_SSH_HOST }}
          port: ${{ secrets.TEST_SSH_PORT || 22 }}
          username: ${{ secrets.TEST_SSH_USER }}
          key: ${{ secrets.TEST_SSH_PRIVATE_KEY }}
          script: |
            set -e
            echo "🚀 开始测试环境部署..."

            # 登录 ACR（国内秒级）
            echo "${{ secrets.ACR_PASSWORD }}" | docker login ${{ secrets.ACR_REGISTRY }} -u ${{ secrets.ACR_USERNAME }} --password-stdin

            # 从 ACR 拉取镜像，tag 为本地名（docker-compose 使用）
            docker pull ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/xbb-backend:latest
            docker tag ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/xbb-backend:latest xbb-backend:latest

            docker pull ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/xbb-frontend:latest
            docker tag ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/xbb-frontend:latest xbb-frontend:latest

            # 停止旧服务
            cd ${{ secrets.TEST_DEPLOY_PATH }}
            docker compose -f docker-compose.test.yml down --timeout 30 || true

            # 启动新服务
            DB_PASSWORD="${{ secrets.TEST_DB_PASSWORD }}" \
            DB_DATABASE="${{ secrets.TEST_DB_DATABASE }}" \
            JWT_SECRET="${{ secrets.TEST_JWT_SECRET }}" \
            DEPLOY_PATH="${{ secrets.TEST_DEPLOY_PATH }}" \
            docker compose -f docker-compose.test.yml up -d --wait

            # 验证
            curl -sf http://localhost:3000/v1/health && echo "✅ 后端正常" || { echo "❌ 后端异常"; exit 1; }
            curl -sf http://localhost/ && echo "✅ 前端正常" || { echo "❌ 前端异常"; exit 1; }

            # 清理
            docker image prune -f
            echo "✅ 测试环境部署完成"

  # ==========================================
  # 部署生产环境（main 分支 → 手动触发）
  # TODO: 生产环境如需迁移到 ghcr.io，更新 deploy.sh 和 docker-compose.yml 后启用
  # ==========================================