# ==========================================
# 销帮帮 CRM 官网 — GitHub Actions 部署流水线
# ==========================================
# 触发规则：
#   develop 分支 → 自动构建 + 部署测试环境
#   main 分支   → 手动触发 + 部署生产环境
# ==========================================
# 镜像策略：
#   构建阶段 → 直接推送 ACR（国内拉取加速）
#   部署阶段 → 测试/生产服务器从 ACR 拉取固定版本（github.sha）
# ==========================================

name: Deploy

on:
  push:
    branches: [develop, main]
  workflow_dispatch:

jobs:
  # ==========================================
  # 预检：类型检查 + Lint + 单元测试
  # ==========================================
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 缓存 TypeScript 增量构建信息
        uses: actions/cache@v4
        with:
          path: |
            my-vue-app/.tsbuildinfo
            my-vue-app/tsconfig.tsbuildinfo
            my-nest-app/tsconfig.tsbuildinfo
          key: tsbuildinfo-${{ github.ref_name }}-${{ hashFiles('my-vue-app/tsconfig.json', 'my-vue-app/tsconfig.app.json', 'my-nest-app/tsconfig.json') }}
          restore-keys: |
            tsbuildinfo-${{ github.ref_name }}-

      - run: pnpm install --frozen-lockfile

      - name: 预检（全部跑完再报告）
        run: |
          set +e
          FAILED=0

          echo "::group::🔍 后端类型检查"
          pnpm -C my-nest-app exec tsc --noEmit
          if [ $? -ne 0 ]; then FAILED=1; echo "❌ 后端类型检查失败"; else echo "✅ 后端类型检查"; fi
          echo "::endgroup::"

          echo "::group::🔍 前端类型检查"
          pnpm -C my-vue-app exec vue-tsc --build --noEmit
          if [ $? -ne 0 ]; then FAILED=1; echo "❌ 前端类型检查失败"; else echo "✅ 前端类型检查"; fi
          echo "::endgroup::"

          echo "::group::🔍 Lint 检查"
          pnpm -C my-vue-app lint
          if [ $? -ne 0 ]; then FAILED=1; echo "❌ Lint 检查失败"; else echo "✅ Lint 检查"; fi
          echo "::endgroup::"

          echo "::group::🔍 后端单元测试"
          pnpm -C my-nest-app test
          if [ $? -ne 0 ]; then FAILED=1; echo "❌ 后端单元测试失败"; else echo "✅ 后端单元测试"; fi
          echo "::endgroup::"

          if [ $FAILED -ne 0 ]; then
            echo ""
            echo "❌ 预检未通过，请修复以上问题后重新推送"
            exit 1
          fi
          echo "✅ 全部预检通过"

  # ==========================================
  # 构建后端镜像 → 推送 ACR（国内拉取加速）
  # ==========================================
  build-backend:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 登录 ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.ACR_REGISTRY }}
          username: ${{ vars.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: 设置 BuildKit
        uses: docker/setup-buildx-action@v3

      - name: 构建并推送 ACR（:sha + :latest）
        uses: docker/build-push-action@v6
        with:
          context: .
          file: my-nest-app/Dockerfile
          push: true
          tags: |
            ${{ vars.ACR_REGISTRY }}/${{ vars.ACR_NAMESPACE }}/xbb-backend:${{ github.sha }}
            ${{ vars.ACR_REGISTRY }}/${{ vars.ACR_NAMESPACE }}/xbb-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=min

  # ==========================================
  # 构建前端镜像 → 推送 ACR（国内拉取加速）
  # ==========================================
  build-frontend:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 登录 ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.ACR_REGISTRY }}
          username: ${{ vars.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: 设置 BuildKit
        uses: docker/setup-buildx-action@v3

      - name: 构建并推送 ACR（:sha + :latest）
        uses: docker/build-push-action@v6
        with:
          context: .
          file: my-vue-app/Dockerfile
          push: true
          tags: |
            ${{ vars.ACR_REGISTRY }}/${{ vars.ACR_NAMESPACE }}/xbb-frontend:${{ github.sha }}
            ${{ vars.ACR_REGISTRY }}/${{ vars.ACR_NAMESPACE }}/xbb-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=min

  # ==========================================
  # 部署（根据分支自动选择环境）
  #   develop → 测试环境（environment: test）
  #   main    → 生产环境（environment: production）
  # ==========================================
  deploy:
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'
    needs: [build-backend, build-frontend]
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'test' }}
    steps:
      - uses: actions/checkout@v4

      # ---- 创建部署目录 + 上传部署文件 ----
      - name: 创建部署目录
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ vars.SSH_PORT || 22 }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            mkdir -p ${{ vars.DEPLOY_PATH }}/scripts

      - name: 上传部署文件到服务器
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ vars.SSH_PORT || 22 }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: docker-compose.yml,scripts/verify-deploy.sh
          target: ${{ vars.DEPLOY_PATH }}
          strip_components: 0

      # ---- SSH 远程部署 ----
      - name: SSH 远程部署
        id: deploy
        continue-on-error: true
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ vars.SSH_PORT || 22 }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            echo "🚀 开始 ${{ github.ref_name == 'main' && '生产' || '测试' }}环境部署..."

            # 登录 ACR
            printf '%s' "${{ secrets.ACR_PASSWORD }}" | docker login ${{ vars.ACR_REGISTRY }} -u ${{ vars.ACR_USERNAME }} --password-stdin

            # 保存当前镜像版本（从 RepoTags 提取 sha 标签，用于回滚）
            echo "📦 保存当前镜像版本..."
            BACKEND_PREV_TAG=$(docker image inspect \
              ${{ vars.ACR_REGISTRY }}/${{ vars.ACR_NAMESPACE }}/xbb-backend:latest \
              --format '{{range .RepoTags}}{{.}}{{"\n"}}{{end}}' 2>/dev/null \
              | grep -oE ':[a-f0-9]{7,40}$' | head -1 | tr -d ':')
            FRONTEND_PREV_TAG=$(docker image inspect \
              ${{ vars.ACR_REGISTRY }}/${{ vars.ACR_NAMESPACE }}/xbb-frontend:latest \
              --format '{{range .RepoTags}}{{.}}{{"\n"}}{{end}}' 2>/dev/null \
              | grep -oE ':[a-f0-9]{7,40}$' | head -1 | tr -d ':')
            if [ -n "$BACKEND_PREV_TAG" ]; then
              echo "  当前后端: $BACKEND_PREV_TAG"
              echo "$BACKEND_PREV_TAG" > /tmp/rollback-backend.tag
            else
              echo "  无上一版本可保存"
              rm -f /tmp/rollback-backend.tag
            fi
            if [ -n "$FRONTEND_PREV_TAG" ]; then
              echo "  当前前端: $FRONTEND_PREV_TAG"
              echo "$FRONTEND_PREV_TAG" > /tmp/rollback-frontend.tag
            else
              echo "  无上一版本可保存"
              rm -f /tmp/rollback-frontend.tag
            fi

            # 拉取新镜像（固定版本）
            echo "📥 拉取新镜像 (${{ github.sha }})..."
            docker pull ${{ vars.ACR_REGISTRY }}/${{ vars.ACR_NAMESPACE }}/xbb-backend:${{ github.sha }}
            docker pull ${{ vars.ACR_REGISTRY }}/${{ vars.ACR_NAMESPACE }}/xbb-frontend:${{ github.sha }}

            # 更新 latest 标签（docker-compose 引用 latest）并推回 ACR
            docker tag ${{ vars.ACR_REGISTRY }}/${{ vars.ACR_NAMESPACE }}/xbb-backend:${{ github.sha }}  ${{ vars.ACR_REGISTRY }}/${{ vars.ACR_NAMESPACE }}/xbb-backend:latest
            docker tag ${{ vars.ACR_REGISTRY }}/${{ vars.ACR_NAMESPACE }}/xbb-frontend:${{ github.sha }} ${{ vars.ACR_REGISTRY }}/${{ vars.ACR_NAMESPACE }}/xbb-frontend:latest
            docker push ${{ vars.ACR_REGISTRY }}/${{ vars.ACR_NAMESPACE }}/xbb-backend:latest
            docker push ${{ vars.ACR_REGISTRY }}/${{ vars.ACR_NAMESPACE }}/xbb-frontend:latest

            # 停止旧服务
            echo "🛑 停止旧服务..."
            cd ${{ vars.DEPLOY_PATH }}
            docker compose -f docker-compose.yml down --timeout 30 || true

            # 注入环境变量，启动新服务
            echo "🚀 启动新服务..."
            export DB_HOST="${{ vars.DB_HOST }}"
            export DB_PORT="${{ vars.DB_PORT || 3306 }}"
            export DB_USERNAME="${{ vars.DB_USERNAME }}"
            export DB_PASSWORD="${{ secrets.DB_PASSWORD }}"
            export DB_DATABASE="${{ vars.DB_DATABASE }}"
            export JWT_SECRET="${{ secrets.JWT_SECRET }}"
            export OSS_REGION="${{ vars.OSS_REGION }}"
            export OSS_BUCKET="${{ vars.OSS_BUCKET }}"
            export OSS_ACCESS_KEY_ID="${{ vars.OSS_ACCESS_KEY_ID }}"
            export OSS_ACCESS_KEY_SECRET="${{ secrets.OSS_ACCESS_KEY_SECRET }}"
            export SMS_USERNAME="${{ vars.SMS_USERNAME }}"
            export SMS_PASSWORD="${{ secrets.SMS_PASSWORD }}"
            export CAPTCHA_JWT_SECRET="${{ secrets.CAPTCHA_JWT_SECRET }}"
            export DATACENTER_TOKEN="${{ secrets.DATACENTER_TOKEN }}"
            export PARTNER_API_TOKEN="${{ secrets.PARTNER_API_TOKEN }}"
            docker compose -f docker-compose.yml up -d --wait

            echo "  ✅ 服务启动正常（docker compose 健康检查通过）"

            docker image prune -f --filter "until=24h" || true

            # 持久化当前部署版本
            echo "${{ github.sha }}" > ${{ vars.DEPLOY_PATH }}/current-version.txt
            echo "  💾 部署版本已持久化: ${{ github.sha }}"

            echo "✅ 部署完成"

      # ---- 部署后验证（after_script，不阻断部署） ----
      - name: 部署后验证
        continue-on-error: true
        if: always()
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ vars.SSH_PORT || 22 }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "📋 运行部署后验证（SEO/安全头/SSR 检查）..."
            if [ -f ${{ vars.DEPLOY_PATH }}/scripts/verify-deploy.sh ]; then
              chmod +x ${{ vars.DEPLOY_PATH }}/scripts/verify-deploy.sh
              bash ${{ vars.DEPLOY_PATH }}/scripts/verify-deploy.sh ${{ github.ref_name == 'main' && '--prod' || '--test' }}
            else
              echo "⚠️  验证脚本不存在，跳过"
            fi

      # ---- 回滚判断 ----
      - name: 回滚判断
        if: steps.deploy.outcome == 'failure'
        shell: bash
        run: |
          ENV="${{ github.ref_name == 'main' && '生产' || '测试' }}"
          echo "❌ ${ENV}环境部署失败，已自动回滚至上一版本"
          exit 1

      # ---- 部署后延迟健康检查（捕获启动后崩溃） ----
      - name: 部署后延迟健康检查
        if: steps.deploy.outcome == 'success'
        shell: bash
        run: |
          echo "⏳ 等待 30 秒后再次确认服务状态..."
          sleep 30

          echo "🔍 后端检查..."
          if curl -sf http://localhost:3000/v1/health > /dev/null 2>&1; then
            echo "  ✅ 后端正常"
          else
            echo "  ⚠️  后端异常，请手动检查"
          fi

          echo "🔍 前端检查..."
          if curl -sf http://localhost:${{ vars.FRONTEND_PORT || 80 }}/ > /dev/null 2>&1; then
            echo "  ✅ 前端正常"
          else
            echo "  ⚠️  前端响应异常，请手动检查 nginx 状态"
          fi

      # ---- 部署通知 ----
      - name: 更新 GitHub Commit Status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const status = '${{ steps.deploy.outcome }}';
            const env = '${{ github.ref_name == 'main' && 'production' || 'test' }}';
            const state = status === 'success' ? 'success' : 'failure';
            const desc = status === 'success'
              ? `✅ ${env} 部署成功 (${process.env.GITHUB_SHA?.substring(0, 7)})`
              : `❌ ${env} 部署失败，已自动回滚`;

            await github.rest.repos.createCommitStatus({
              ...context.repo,
              sha: context.sha,
              state: state,
              context: `Deploy (${env})`,
              description: desc,
            });