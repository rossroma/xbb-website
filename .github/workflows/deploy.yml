# ==========================================
# 销帮帮 CRM 官网 — GitHub Actions 部署流水线
# ==========================================
# 触发规则：
#   develop 分支 → 自动构建 + 部署测试环境
#   main 分支   → 手动触发 + 部署生产环境
# ==========================================
# 镜像策略：
#   构建阶段 → 双推 ghcr.io（层缓存） + ACR（国内拉取）
#   部署阶段 → 测试/生产服务器从 ACR 拉取
# ==========================================

name: Deploy

on:
  push:
    branches: [develop, main]
  workflow_dispatch:

env:
  GHCR: ghcr.io
  IMAGE_BACKEND: ${{ github.repository }}/xbb-backend
  IMAGE_FRONTEND: ${{ github.repository }}/xbb-frontend

jobs:
  # ==========================================
  # 预检：类型检查 + Lint + 单元测试
  # ==========================================
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 缓存 TypeScript 增量构建信息
        uses: actions/cache@v4
        with:
          path: |
            my-vue-app/.tsbuildinfo
            my-vue-app/tsconfig.tsbuildinfo
            my-nest-app/tsconfig.tsbuildinfo
          key: tsbuildinfo-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            tsbuildinfo-${{ github.ref_name }}-

      - run: pnpm install --frozen-lockfile

      - name: 预检（全部跑完再报告）
        run: |
          set +e
          FAILED=0

          echo "::group::🔍 后端类型检查"
          pnpm -C my-nest-app exec tsc --noEmit
          if [ $? -ne 0 ]; then FAILED=1; echo "❌ 后端类型检查失败"; else echo "✅ 后端类型检查"; fi
          echo "::endgroup::"

          echo "::group::🔍 前端类型检查"
          pnpm -C my-vue-app exec vue-tsc --build --noEmit
          if [ $? -ne 0 ]; then FAILED=1; echo "❌ 前端类型检查失败"; else echo "✅ 前端类型检查"; fi
          echo "::endgroup::"

          echo "::group::🔍 Lint 检查"
          pnpm -C my-vue-app lint
          if [ $? -ne 0 ]; then FAILED=1; echo "❌ Lint 检查失败"; else echo "✅ Lint 检查"; fi
          echo "::endgroup::"

          echo "::group::🔍 后端单元测试"
          pnpm -C my-nest-app test
          if [ $? -ne 0 ]; then FAILED=1; echo "❌ 后端单元测试失败"; else echo "✅ 后端单元测试"; fi
          echo "::endgroup::"

          if [ $FAILED -ne 0 ]; then
            echo ""
            echo "❌ 预检未通过，请修复以上问题后重新推送"
            exit 1
          fi
          echo "✅ 全部预检通过"

  # ==========================================
  # 构建后端镜像 → 双推 ghcr.io + ACR
  # ==========================================
  build-backend:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: 登录 ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 设置 BuildKit
        uses: docker/setup-buildx-action@v3

      - name: 构建并推送 ghcr.io
        uses: docker/build-push-action@v6
        with:
          context: .
          file: my-nest-app/Dockerfile
          push: true
          tags: |
            ${{ env.GHCR }}/${{ env.IMAGE_BACKEND }}:${{ github.sha }}
            ${{ env.GHCR }}/${{ env.IMAGE_BACKEND }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 同步到 ACR（国内加速）
        continue-on-error: true
        shell: bash
        run: |
          ACR_IMAGE="${{ vars.ACR_REGISTRY }}/${{ vars.ACR_NAMESPACE }}/xbb-backend"
          echo "${{ secrets.ACR_PASSWORD }}" | docker login "${{ vars.ACR_REGISTRY }}" -u "${{ vars.ACR_USERNAME }}" --password-stdin
          docker pull ${{ env.GHCR }}/${{ env.IMAGE_BACKEND }}:${{ github.sha }}
          docker tag ${{ env.GHCR }}/${{ env.IMAGE_BACKEND }}:${{ github.sha }} ${ACR_IMAGE}:${{ github.sha }}
          docker tag ${{ env.GHCR }}/${{ env.IMAGE_BACKEND }}:${{ github.sha }} ${ACR_IMAGE}:latest
          docker push ${ACR_IMAGE}:${{ github.sha }}
          docker push ${ACR_IMAGE}:latest

  # ==========================================
  # 构建前端镜像 → 双推 ghcr.io + ACR
  # ==========================================
  build-frontend:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: 登录 ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 设置 BuildKit
        uses: docker/setup-buildx-action@v3

      - name: 构建并推送 ghcr.io
        uses: docker/build-push-action@v6
        with:
          context: .
          file: my-vue-app/Dockerfile
          push: true
          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL }}
          tags: |
            ${{ env.GHCR }}/${{ env.IMAGE_FRONTEND }}:${{ github.sha }}
            ${{ env.GHCR }}/${{ env.IMAGE_FRONTEND }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 同步到 ACR（国内加速）
        continue-on-error: true
        shell: bash
        run: |
          ACR_IMAGE="${{ vars.ACR_REGISTRY }}/${{ vars.ACR_NAMESPACE }}/xbb-frontend"
          echo "${{ secrets.ACR_PASSWORD }}" | docker login "${{ vars.ACR_REGISTRY }}" -u "${{ vars.ACR_USERNAME }}" --password-stdin
          docker pull ${{ env.GHCR }}/${{ env.IMAGE_FRONTEND }}:${{ github.sha }}
          docker tag ${{ env.GHCR }}/${{ env.IMAGE_FRONTEND }}:${{ github.sha }} ${ACR_IMAGE}:${{ github.sha }}
          docker tag ${{ env.GHCR }}/${{ env.IMAGE_FRONTEND }}:${{ github.sha }} ${ACR_IMAGE}:latest
          docker push ${ACR_IMAGE}:${{ github.sha }}
          docker push ${ACR_IMAGE}:latest

  # ==========================================
  # 部署测试环境（develop 分支 → 自动触发）
  # 变量由 Environment: test 提供，与生产环境使用相同变量名，不同值
  # ==========================================
  deploy-test:
    if: github.ref == 'refs/heads/develop'
    needs: [build-backend, build-frontend]
    runs-on: ubuntu-latest
    environment:
      name: test
    steps:
      - uses: actions/checkout@v4

      # 上传 docker-compose 文件、部署脚本和验证脚本到服务器
      - name: 上传部署文件到服务器
        shell: bash
        run: |
          SSH_HOST="${{ secrets.SSH_HOST }}"
          SSH_PORT="${{ vars.SSH_PORT || 22 }}"
          SSH_USER="${{ secrets.SSH_USER }}"
          SSH_KEY="${{ secrets.SSH_PRIVATE_KEY }}"
          DEPLOY_PATH="${{ vars.DEPLOY_PATH }}"

          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          SCP_CMD="scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -P $SSH_PORT"
          SSH_CMD="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -p $SSH_PORT $SSH_USER@$SSH_HOST"
          $SSH_CMD "mkdir -p $DEPLOY_PATH"

          $SCP_CMD \
            docker-compose.yml \
            docker-compose.test.yml \
            "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/"

          $SCP_CMD \
            deploy.test.sh \
            scripts/verify-deploy.sh \
            "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/"

      - name: SSH 部署到测试服务器
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ vars.SSH_PORT || 22 }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            echo "🚀 开始测试环境部署..."

            # 登录 ACR（Repository 级共享变量）
            echo "${{ secrets.ACR_PASSWORD }}" | docker login ${{ vars.ACR_REGISTRY }} -u ${{ vars.ACR_USERNAME }} --password-stdin

            # 从 ACR 拉取
            docker pull ${{ vars.ACR_REGISTRY }}/${{ vars.ACR_NAMESPACE }}/xbb-backend:latest
            docker tag ${{ vars.ACR_REGISTRY }}/${{ vars.ACR_NAMESPACE }}/xbb-backend:latest xbb-backend:latest

            docker pull ${{ vars.ACR_REGISTRY }}/${{ vars.ACR_NAMESPACE }}/xbb-frontend:latest
            docker tag ${{ vars.ACR_REGISTRY }}/${{ vars.ACR_NAMESPACE }}/xbb-frontend:latest xbb-frontend:latest

            # 停止旧服务
            cd ${{ vars.DEPLOY_PATH }}
            docker compose -f docker-compose.test.yml down --timeout 30 || true

            # 启动 MySQL 容器
            export DB_PASSWORD="${{ secrets.DB_PASSWORD }}"
            export DB_DATABASE="${{ vars.DB_DATABASE }}"
            docker compose -f docker-compose.test.yml up -d --wait mysql

            # 启动后端 + 前端
            echo "🚀 启动后端和前端服务..."
            export JWT_SECRET="${{ secrets.JWT_SECRET }}"
            export OSS_REGION="${{ vars.OSS_REGION }}"
            export OSS_BUCKET="${{ vars.OSS_BUCKET }}"
            export OSS_ACCESS_KEY_ID="${{ vars.OSS_ACCESS_KEY_ID }}"
            export OSS_ACCESS_KEY_SECRET="${{ secrets.OSS_ACCESS_KEY_SECRET }}"
            export SMS_USERNAME="${{ vars.SMS_USERNAME }}"
            export SMS_PASSWORD="${{ secrets.SMS_PASSWORD }}"
            export CAPTCHA_JWT_SECRET="${{ secrets.CAPTCHA_JWT_SECRET }}"
            export DATACENTER_TOKEN="${{ secrets.DATACENTER_TOKEN }}"
            export PARTNER_API_TOKEN="${{ secrets.PARTNER_API_TOKEN }}"
            docker compose -f docker-compose.test.yml up -d --wait

            # 健康检查
            for i in $(seq 1 10); do
              curl -sf http://localhost:3000/v1/health && break
              [ "$i" -eq 10 ] && { echo "❌ 后端启动超时"; exit 1; }
              sleep 3
            done
            echo "✅ 后端正常"

            curl -sf http://localhost/ && echo "✅ 前端正常" || { echo "❌ 前端异常"; exit 1; }

            # 部署后验证
            echo ""
            echo "📋 运行部署后验证..."
            chmod +x ${{ vars.DEPLOY_PATH }}/verify-deploy.sh
            bash ${{ vars.DEPLOY_PATH }}/verify-deploy.sh --test || true

            docker image prune -f
            echo "✅ 测试环境部署完成"

  # ==========================================
  # 部署生产环境（main 分支 → 手动触发）
  # ==========================================
  deploy-prod:
    if: github.ref == 'refs/heads/main'
    needs: [build-backend, build-frontend]
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - uses: actions/checkout@v4

      # 上传 docker-compose 文件、部署脚本和验证脚本到服务器
      - name: 上传部署文件到服务器
        shell: bash
        run: |
          SSH_HOST="${{ secrets.SSH_HOST }}"
          SSH_PORT="${{ vars.SSH_PORT || 22 }}"
          SSH_USER="${{ secrets.SSH_USER }}"
          SSH_KEY="${{ secrets.SSH_PRIVATE_KEY }}"
          DEPLOY_PATH="${{ vars.DEPLOY_PATH }}"

          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          SCP_CMD="scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -P $SSH_PORT"
          SSH_CMD="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -p $SSH_PORT $SSH_USER@$SSH_HOST"
          $SSH_CMD "mkdir -p $DEPLOY_PATH"

          # 上传 docker-compose 文件
          $SCP_CMD \
            docker-compose.yml \
            "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/"

          # 上传部署脚本和验证脚本
          $SCP_CMD \
            deploy.sh \
            scripts/verify-deploy.sh \
            "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/"

      - name: SSH 部署到生产服务器
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ vars.SSH_PORT || 22 }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            echo "🚀 开始生产环境部署..."

            # 登录 ACR 并拉取镜像
            echo "${{ secrets.ACR_PASSWORD }}" | docker login ${{ vars.ACR_REGISTRY }} -u ${{ vars.ACR_USERNAME }} --password-stdin
            docker pull ${{ vars.ACR_REGISTRY }}/${{ vars.ACR_NAMESPACE }}/xbb-backend:latest
            docker pull ${{ vars.ACR_REGISTRY }}/${{ vars.ACR_NAMESPACE }}/xbb-frontend:latest

            # 停止旧服务
            cd ${{ vars.DEPLOY_PATH }}
            docker compose -f docker-compose.yml down --timeout 30 || true

            # 启动新服务
            echo "🚀 启动新服务..."
            docker compose -f docker-compose.yml up -d --wait

            # 健康检查
            for i in $(seq 1 10); do
              curl -sf http://localhost:3000/v1/health && break
              [ "$i" -eq 10 ] && { echo "❌ 后端启动超时"; exit 1; }
              sleep 3
            done
            echo "✅ 后端正常"

            curl -sf http://localhost/ && echo "✅ 前端正常" || { echo "❌ 前端异常"; exit 1; }

            # 部署后验证
            echo ""
            echo "📋 运行部署后验证..."
            chmod +x ${{ vars.DEPLOY_PATH }}/verify-deploy.sh
            bash ${{ vars.DEPLOY_PATH }}/verify-deploy.sh --prod || true

            docker image prune -f
            echo "✅ 生产环境部署完成"