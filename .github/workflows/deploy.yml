# ==========================================
# 销帮帮 CRM 官网 — GitHub Actions 部署流水线
# ==========================================
# 触发规则：
#   push → develop/main: 自动构建 + 部署测试/生产环境
#   pull_request → develop/main: 仅执行预检（类型检查 + Lint + 单元测试），不构建部署
# ==========================================
# 镜像策略：
#   构建阶段 → 推送 ACR（仅 SHA 标签，不可变；:latest 在部署成功后更新）
#   部署阶段 → 服务器拉取 SHA 标签，通过 BACKEND_TAG/FRONTEND_TAG 环境变量控制版本
#   本地保留 → 服务器保留当前版本 + 上一个版本镜像，回滚零网络依赖
#   回滚策略 → 部署前生成 rollback.sh，失败时自动执行恢复旧版本
# ==========================================

name: Deploy

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  # ==========================================
  # 预检：类型检查 + Lint + 单元测试
  # ==========================================
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 缓存 TypeScript 增量构建信息
        uses: actions/cache@v4
        with:
          path: |
            my-vue-app/.tsbuildinfo
            my-vue-app/tsconfig.tsbuildinfo
            my-nest-app/tsconfig.tsbuildinfo
          key: tsbuildinfo-${{ github.ref_name }}-${{ hashFiles('my-vue-app/tsconfig.json', 'my-vue-app/tsconfig.app.json', 'my-nest-app/tsconfig.json') }}
          restore-keys: |
            tsbuildinfo-${{ github.ref_name }}-

      - run: pnpm install --frozen-lockfile

      - name: 预检（全部跑完再报告）
        run: |
          set +e
          FAILED=0

          echo "::group::🔍 后端类型检查"
          pnpm -C my-nest-app exec tsc --noEmit
          if [ $? -ne 0 ]; then FAILED=1; echo "❌ 后端类型检查失败"; else echo "✅ 后端类型检查"; fi
          echo "::endgroup::"

          echo "::group::🔍 前端类型检查"
          pnpm -C my-vue-app exec vue-tsc --build --noEmit
          if [ $? -ne 0 ]; then FAILED=1; echo "❌ 前端类型检查失败"; else echo "✅ 前端类型检查"; fi
          echo "::endgroup::"

          echo "::group::🔍 Lint 检查"
          pnpm -C my-vue-app lint
          if [ $? -ne 0 ]; then FAILED=1; echo "❌ Lint 检查失败"; else echo "✅ Lint 检查"; fi
          echo "::endgroup::"

          echo "::group::🔍 后端单元测试"
          pnpm -C my-nest-app test
          if [ $? -ne 0 ]; then FAILED=1; echo "❌ 后端单元测试失败"; else echo "✅ 后端单元测试"; fi
          echo "::endgroup::"

          if [ $FAILED -ne 0 ]; then
            echo ""
            echo "❌ 预检未通过，请修复以上问题后重新推送"
            exit 1
          fi
          echo "✅ 全部预检通过"

  # ==========================================
  # 构建后端镜像 → 推送 ACR（国内拉取加速）
  # ==========================================
  build-backend:
    if: github.event_name == 'push'
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 登录 ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.ACR_REGISTRY }}
          username: ${{ vars.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: 设置 BuildKit
        uses: docker/setup-buildx-action@v3

      - name: 构建并推送 ACR（仅 :sha，:latest 在部署成功后更新）
        uses: docker/build-push-action@v6
        with:
          context: .
          file: my-nest-app/Dockerfile
          push: true
          provenance: false
          tags: |
            ${{ vars.ACR_REGISTRY }}/${{ vars.ACR_NAMESPACE }}/xbb-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=min

  # ==========================================
  # 构建前端镜像 → 推送 ACR（国内拉取加速）
  # ==========================================
  build-frontend:
    if: github.event_name == 'push'
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 登录 ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.ACR_REGISTRY }}
          username: ${{ vars.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: 设置 BuildKit
        uses: docker/setup-buildx-action@v3

      - name: 构建并推送 ACR（仅 :sha，:latest 在部署成功后更新）
        uses: docker/build-push-action@v6
        with:
          context: .
          file: my-vue-app/Dockerfile
          push: true
          provenance: false
          tags: |
            ${{ vars.ACR_REGISTRY }}/${{ vars.ACR_NAMESPACE }}/xbb-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=min

  # ==========================================
  # 部署（根据分支自动选择环境）
  #   develop → 测试环境（environment: test）
  #   main    → 生产环境（environment: production）
  # ==========================================
  # 部署策略：
  #   1. 🔒 安全区 — 获取当前版本、生成 rollback.sh、拉取新镜像
  #      （此时任何步骤失败都不影响运行中的旧容器）
  #   2. 🚀 Swap — 用新 SHA 标签启动容器（docker compose up -d）
  #      不用 :latest，不先 down 再 up
  #   3. ✅ 成功 — 更新 :latest 标签、持久化版本号
  #   4. ❌ 失败 — 执行 rollback.sh（swap 前生成，恢复旧版本）
  # ==========================================
  deploy:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    needs: [build-backend, build-frontend]
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'test' }}
    steps:
      - uses: actions/checkout@v4

      # ---- 创建部署目录 + 上传部署文件 ----
      - name: 创建部署目录
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ vars.SSH_PORT || 22 }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            mkdir -p ${{ vars.DEPLOY_PATH }}/scripts

      - name: 上传部署文件到服务器
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ vars.SSH_PORT || 22 }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: docker-compose.yml,scripts/verify-deploy.sh
          target: ${{ vars.DEPLOY_PATH }}
          strip_components: 0

      # ==========================================
      # Phase 1: 🔒 安全区 — 准备部署
      # 不碰运行中的容器，任何失败都不影响旧服务
      # ==========================================
      - name: 🔒 准备部署（安全区）
        id: prepare
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ vars.SSH_PORT || 22 }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            echo "🔒 安全区：准备部署..."

            # 登录 ACR
            printf '%s' "${{ secrets.ACR_PASSWORD }}" | docker login ${{ vars.ACR_REGISTRY }} -u ${{ vars.ACR_USERNAME }} --password-stdin

            # ---- 获取当前版本 SHA ----
            PREV_SHA=""
            if [ -f ${{ vars.DEPLOY_PATH }}/current-version.txt ]; then
              PREV_SHA=$(cat ${{ vars.DEPLOY_PATH }}/current-version.txt)
              echo "  当前版本: $PREV_SHA"
              # 持久化上一个版本 SHA，供后续步骤使用（本地双版本保留）
              echo "$PREV_SHA" > ${{ vars.DEPLOY_PATH }}/scripts/prev-version.txt
            else
              rm -f ${{ vars.DEPLOY_PATH }}/scripts/prev-version.txt
              echo "  无上一版本（首次部署，无可回滚目标）"
            fi

            # ---- 生成 rollback.sh（包含当前版本 SHA，swap 前生成） ----
            # 用 echo 逐行写入，避免 heredoc 在 YAML 缩进中 delimiter 失效的问题
            if [ -n "$PREV_SHA" ]; then
              RB="${{ vars.DEPLOY_PATH }}/scripts/rollback.sh"
              : > "$RB"  # 清空文件
              echo '#!/bin/bash' >> "$RB"
              echo '# ==========================================' >> "$RB"
              echo '# 自动生成的回滚脚本 — 在 swap 前生成' >> "$RB"
              echo '# 如果部署失败，执行此脚本恢复旧版本' >> "$RB"
              echo '# ==========================================' >> "$RB"
              echo 'set -euo pipefail' >> "$RB"
              echo "" >> "$RB"
              echo "PREV_SHA=\"$PREV_SHA\"" >> "$RB"
              echo "export ACR_REGISTRY=\"${{ vars.ACR_REGISTRY }}\"" >> "$RB"
              echo "export ACR_NAMESPACE=\"${{ vars.ACR_NAMESPACE }}\"" >> "$RB"
              echo "DEPLOY_PATH=\"${{ vars.DEPLOY_PATH }}\"" >> "$RB"
              echo "" >> "$RB"
              echo 'echo "🔄 执行回滚至版本: $PREV_SHA"' >> "$RB"
              echo "" >> "$RB"
              echo '# 登录 ACR（密码从环境变量读取）' >> "$RB"
              echo 'echo "$ACR_PASSWORD" | docker login $ACR_REGISTRY -u "$ACR_USERNAME" --password-stdin' >> "$RB"
              echo "" >> "$RB"
              echo '# 优先使用本地镜像，本地不存在时从 ACR 拉取' >> "$RB"
              echo 'echo "📥 检查本地镜像..."' >> "$RB"
              echo 'for img in "xbb-backend" "xbb-frontend"; do' >> "$RB"
              echo "  if docker images --format '{{.Tag}}' \"\$ACR_REGISTRY/\$ACR_NAMESPACE/\$img\" 2>/dev/null | grep -qFx \"\$PREV_SHA\"; then" >> "$RB"
              echo '    echo "  ✅ $img:$PREV_SHA 本地镜像存在"' >> "$RB"
              echo '  else' >> "$RB"
              echo '    echo "  📥 $img:$PREV_SHA 本地不存在，从 ACR 拉取..."' >> "$RB"
              echo "    docker pull \"\$ACR_REGISTRY/\$ACR_NAMESPACE/\$img:\$PREV_SHA\"" >> "$RB"
              echo '  fi' >> "$RB"
              echo 'done' >> "$RB"
              echo "" >> "$RB"
              echo '# 用旧版本启动' >> "$RB"
              echo 'echo "🚀 启动旧版本: $PREV_SHA..."' >> "$RB"
              echo 'export BACKEND_TAG=$PREV_SHA' >> "$RB"
              echo 'export FRONTEND_TAG=$PREV_SHA' >> "$RB"
              echo 'cd $DEPLOY_PATH && docker compose up -d --wait --wait-timeout 180' >> "$RB"
              echo "" >> "$RB"
              echo 'echo "✅ 回滚完成，版本: $PREV_SHA"' >> "$RB"
              chmod +x "$RB"
              echo "  ✅ rollback.sh 已生成（版本: $PREV_SHA）"
            else
              # 无旧版本，生成一个"无法回滚"的提示脚本
              RB="${{ vars.DEPLOY_PATH }}/scripts/rollback.sh"
              echo '#!/bin/bash' > "$RB"
              echo 'echo "⚠️  无上一版本可回滚，请手动检查"' >> "$RB"
              echo 'exit 1' >> "$RB"
              chmod +x "$RB"
              echo "  ⚠️  无上一版本，rollback.sh 仅提示"
            fi

            # ---- 拉取新镜像（固定 SHA 版本，不覆盖 :latest） ----
            echo "📥 拉取新镜像 (${{ github.sha }})..."
            docker pull ${{ vars.ACR_REGISTRY }}/${{ vars.ACR_NAMESPACE }}/xbb-backend:${{ github.sha }}
            docker pull ${{ vars.ACR_REGISTRY }}/${{ vars.ACR_NAMESPACE }}/xbb-frontend:${{ github.sha }}
            echo "  ✅ 新镜像就绪"

            echo "🔒 安全区准备完成"

      # ==========================================
      # Phase 2: 🚀 Swap — 执行部署
      # 通过 BACKEND_TAG/FRONTEND_TAG 环境变量指定 SHA 版本
      # 不再先 down 再 up，让 compose 自动替换容器
      # ==========================================
      - name: 🚀 执行部署（Swap）
        id: deploy
        continue-on-error: true
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ vars.SSH_PORT || 22 }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            echo "🚀 开始 ${{ github.ref_name == 'main' && '生产' || '测试' }}环境部署..."
            echo "  后端版本: ${{ github.sha }}"
            echo "  前端版本: ${{ github.sha }}"

            # 注入环境变量（用 SHA 标签，不用 :latest）
            export BACKEND_TAG=${{ github.sha }}
            export FRONTEND_TAG=${{ github.sha }}
            export ACR_REGISTRY="${{ vars.ACR_REGISTRY }}"
            export ACR_NAMESPACE="${{ vars.ACR_NAMESPACE }}"
            export DEPLOY_PATH="${{ vars.DEPLOY_PATH }}"
            export DB_HOST="${{ vars.DB_HOST }}"
            export DB_PORT="${{ vars.DB_PORT || 3306 }}"
            export DB_USERNAME="${{ vars.DB_USERNAME }}"
            export DB_PASSWORD="${{ secrets.DB_PASSWORD }}"
            export DB_DATABASE="${{ vars.DB_DATABASE }}"
            export JWT_SECRET="${{ secrets.JWT_SECRET }}"
            export OSS_REGION="${{ vars.OSS_REGION }}"
            export OSS_BUCKET="${{ vars.OSS_BUCKET }}"
            export OSS_ACCESS_KEY_ID="${{ vars.OSS_ACCESS_KEY_ID }}"
            export OSS_ACCESS_KEY_SECRET="${{ secrets.OSS_ACCESS_KEY_SECRET }}"
            export SMS_USERNAME="${{ vars.SMS_USERNAME }}"
            export SMS_PASSWORD="${{ secrets.SMS_PASSWORD }}"
            export CAPTCHA_JWT_SECRET="${{ secrets.CAPTCHA_JWT_SECRET }}"
            export DATACENTER_TOKEN="${{ secrets.DATACENTER_TOKEN }}"
            export PARTNER_API_TOKEN="${{ secrets.PARTNER_API_TOKEN }}"
            export FRONTEND_PORT="${{ vars.FRONTEND_PORT || 80 }}"

            # 启动新服务（compose 自动替换容器）
            # --wait-timeout 180：覆盖默认超时，确保 healthcheck 有足够时间通过
            # （healthcheck 配置：start_period 15s + retries 3 × interval 30s = 最大 105s）
            cd ${{ vars.DEPLOY_PATH }}
            docker compose up -d --wait --wait-timeout 180

            echo "  ✅ 服务启动正常（docker compose 健康检查通过）"

            # ---- 本地双版本保留：保留当前版本 + 上一个版本，删除其他 ----
            # 确保回滚时不需要依赖 ACR 可用性，本地镜像直接可用
            echo "🧹 清理旧镜像（保留当前版本和上一个版本）..."
            PREV_SHA=""
            if [ -f ${{ vars.DEPLOY_PATH }}/scripts/prev-version.txt ]; then
              PREV_SHA=$(cat ${{ vars.DEPLOY_PATH }}/scripts/prev-version.txt)
            fi
            NEW_SHA="${{ github.sha }}"
            for img in "xbb-backend" "xbb-frontend"; do
              FULL_REF="${{ vars.ACR_REGISTRY }}/${{ vars.ACR_NAMESPACE }}/$img"
              docker images --format '{{.Tag}}' "$FULL_REF" 2>/dev/null | while read tag; do
                if [ "$tag" != "$NEW_SHA" ] && [ "$tag" != "$PREV_SHA" ] && [ "$tag" != "latest" ]; then
                  docker rmi "$FULL_REF:$tag" 2>/dev/null || true
                fi
              done
            done
            rm -f ${{ vars.DEPLOY_PATH }}/scripts/prev-version.txt
            echo "  ✅ 本地镜像清理完成（保留版本: $NEW_SHA${PREV_SHA:+" + $PREV_SHA"}）"

            echo "✅ 部署完成"

      # ==========================================
      # 部署后验证（after_script，不阻断部署）
      # ==========================================
      - name: 部署后验证
        id: verify
        continue-on-error: true
        if: always()
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ vars.SSH_PORT || 22 }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "📋 运行部署后验证（SEO/安全头/SSR 检查）..."
            export FRONTEND_PORT="${{ vars.FRONTEND_PORT || 80 }}"
            if [ -f ${{ vars.DEPLOY_PATH }}/scripts/verify-deploy.sh ]; then
              chmod +x ${{ vars.DEPLOY_PATH }}/scripts/verify-deploy.sh
              bash ${{ vars.DEPLOY_PATH }}/scripts/verify-deploy.sh ${{ github.ref_name == 'main' && '--prod' || '--test' }}
            else
              echo "⚠️  验证脚本不存在，跳过"
            fi

      # ==========================================
      # Phase 3a: ✅ 成功 — 更新 :latest 标签
      # 新版本已验证通过，才更新 :latest
      # 此步骤仅在部署成功且验证通过后执行
      # ==========================================
      - name: ✅ 部署成功 — 更新 :latest 标签
        if: steps.deploy.outcome == 'success' && steps.verify.outcome == 'success'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ vars.SSH_PORT || 22 }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            echo "📌 部署成功，更新 :latest 标签..."

            # 标记新版本为 :latest 并推回 ACR
            docker tag ${{ vars.ACR_REGISTRY }}/${{ vars.ACR_NAMESPACE }}/xbb-backend:${{ github.sha }} \
              ${{ vars.ACR_REGISTRY }}/${{ vars.ACR_NAMESPACE }}/xbb-backend:latest
            docker tag ${{ vars.ACR_REGISTRY }}/${{ vars.ACR_NAMESPACE }}/xbb-frontend:${{ github.sha }} \
              ${{ vars.ACR_REGISTRY }}/${{ vars.ACR_NAMESPACE }}/xbb-frontend:latest
            docker push ${{ vars.ACR_REGISTRY }}/${{ vars.ACR_NAMESPACE }}/xbb-backend:latest
            docker push ${{ vars.ACR_REGISTRY }}/${{ vars.ACR_NAMESPACE }}/xbb-frontend:latest
            echo "  ✅ :latest 标签已更新"

            # 持久化部署版本
            echo "${{ github.sha }}" > ${{ vars.DEPLOY_PATH }}/current-version.txt
            echo "  💾 部署版本已持久化: ${{ github.sha }}"

            # 清理 rollback.sh（新版本已验证，不再需要旧版本回滚）
            rm -f ${{ vars.DEPLOY_PATH }}/scripts/rollback.sh
            echo "  🧹 rollback.sh 已清理"

            echo "✅ 部署成功处理完成"

      # ==========================================
      # Phase 3b: ❌ 失败 — 执行回滚
      # 执行 swap 前生成的 rollback.sh，恢复旧版本
      # ==========================================
      - name: ❌ 部署失败 — 执行回滚
        if: steps.deploy.outcome == 'failure'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ vars.SSH_PORT || 22 }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "❌ 部署失败，执行回滚..."
            echo ""

            if [ -f ${{ vars.DEPLOY_PATH }}/scripts/rollback.sh ]; then
              # 传递 ACR 凭据给 rollback 脚本
              export ACR_PASSWORD="${{ secrets.ACR_PASSWORD }}"
              export ACR_USERNAME="${{ vars.ACR_USERNAME }}"
              bash ${{ vars.DEPLOY_PATH }}/scripts/rollback.sh
            else
              echo "⚠️  rollback.sh 不存在，无法自动回滚"
              echo "   请手动 SSH 到服务器检查状态："
              echo "   ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}"
              echo "   cd ${{ vars.DEPLOY_PATH }} && docker compose ps"
              exit 1
            fi

      # ==========================================
      # 标记工作流为失败（回滚后让 Actions 界面显示红色 ❌）
      # continue-on-error: true 会导致 Swap 失败后 workflow 整体仍显示绿色 ✅
      # 此步骤显式 exit 1 确保回滚后的真实状态反映在 UI 上
      # ==========================================
      - name: ❌ 标记工作流为失败（已回滚）
        if: steps.deploy.outcome == 'failure'
        run: |
          echo "❌ 部署失败，已自动回滚至上一版本"
          echo "   请检查部署日志定位根因，修复后重新部署"
          exit 1

      # ==========================================
      # 部署后延迟健康检查（捕获启动后崩溃）
      # 在远程服务器上执行，确保真实服务状态可验证
      # ==========================================
      - name: 部署后延迟健康检查
        if: steps.deploy.outcome == 'success' && steps.verify.outcome == 'success'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ vars.SSH_PORT || 22 }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "⏳ 等待 30 秒后再次确认服务状态..."
            sleep 30

            echo "🔍 后端检查..."
            curl -sf http://localhost:3000/v1/health > /dev/null 2>&1 \
              && echo "  ✅ 后端正常" \
              || echo "  ⚠️  后端异常，请手动检查"

            echo "🔍 前端检查..."
            curl -sf http://localhost:${{ vars.FRONTEND_PORT || 80 }}/ > /dev/null 2>&1 \
              && echo "  ✅ 前端正常" \
              || echo "  ⚠️  前端响应异常，请手动检查 nginx 状态"

      # ==========================================
      # 部署通知 — 更新 GitHub Commit Status
      # ==========================================
      - name: 更新 GitHub Commit Status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const deployStatus = '${{ steps.deploy.outcome }}';
            const verifyStatus = '${{ steps.verify.outcome }}';
            const env = '${{ github.ref_name == 'main' && 'production' || 'test' }}';

            let state, desc;
            if (deployStatus === 'success') {
              if (verifyStatus === 'success') {
                state = 'success';
                desc = `✅ ${env} 部署成功 (${process.env.GITHUB_SHA?.substring(0, 7)})`;
              } else {
                state = 'success';
                desc = `⚠️ ${env} 部署完成但验证未通过 — 请手动检查`;
              }
            } else {
              state = 'failure';
              desc = `❌ ${env} 部署失败，已自动回滚`;
            }

            await github.rest.repos.createCommitStatus({
              ...context.repo,
              sha: context.sha,
              state: state,
              context: `Deploy (${env})`,
              description: desc,
            });