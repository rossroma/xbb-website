# ==========================================
# 销帮帮 CRM 官网 — GitHub Actions 部署流水线
# ==========================================
# 触发规则：
#   develop 分支 → 自动构建 + 部署测试环境
#   main 分支   → 手动触发 + 部署生产环境
# ==========================================

name: Deploy

on:
  push:
    branches: [develop, main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_BACKEND: ${{ github.repository }}/xbb-backend
  IMAGE_FRONTEND: ${{ github.repository }}/xbb-frontend

jobs:
  # ==========================================
  # 构建后端镜像 → 推送 ghcr.io
  # ==========================================
  build-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: 登录 ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 设置 BuildKit
        uses: docker/setup-buildx-action@v3

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          file: my-nest-app/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_BACKEND }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_BACKEND }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================================
  # 构建前端镜像 → 推送 ghcr.io
  # ==========================================
  build-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: 登录 ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 设置 BuildKit
        uses: docker/setup-buildx-action@v3

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          file: my-vue-app/Dockerfile
          push: true
          build-args: |
            VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_FRONTEND }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_FRONTEND }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================================
  # 部署测试环境（develop 分支 → 自动触发）
  # ==========================================
  deploy-test:
    if: github.ref == 'refs/heads/develop'
    needs: [build-backend, build-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: SSH 部署到测试服务器
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.TEST_SSH_HOST }}
          port: ${{ secrets.TEST_SSH_PORT || 22 }}
          username: ${{ secrets.TEST_SSH_USER }}
          key: ${{ secrets.TEST_SSH_PRIVATE_KEY }}
          script: |
            set -e
            echo "🚀 开始测试环境部署..."

            # 登录 ghcr.io（使用 GitHub Token）
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # 拉取镜像
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_BACKEND }}:latest
            docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_BACKEND }}:latest xbb-backend:latest

            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_FRONTEND }}:latest
            docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_FRONTEND }}:latest xbb-frontend:latest

            # 停止旧服务
            cd ${{ secrets.TEST_DEPLOY_PATH }}
            docker compose -f docker-compose.test.yml down --timeout 30 || true

            # 启动新服务
            DB_PASSWORD="${{ secrets.TEST_DB_PASSWORD }}" \
            DB_DATABASE="${{ secrets.TEST_DB_DATABASE }}" \
            JWT_SECRET="${{ secrets.TEST_JWT_SECRET }}" \
            DEPLOY_PATH="${{ secrets.TEST_DEPLOY_PATH }}" \
            docker compose -f docker-compose.test.yml up -d --wait

            # 验证
            curl -sf http://localhost:3000/v1/health && echo "✅ 后端" || { echo "❌ 后端"; exit 1; }
            curl -sf http://localhost/ && echo "✅ 前端" || { echo "❌ 前端"; exit 1; }

            # 清理
            docker image prune -f
            echo "✅ 部署完成"

  # ==========================================
  # 部署生产环境（main 分支 → 手动触发）
  # TODO: 生产环境暂保留原有 ACR 流程，后续迁移
  # ==========================================