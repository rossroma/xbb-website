# ==========================================
# 销帮帮 CRM 官网 — GitHub Actions 部署流水线
# ==========================================
# 触发规则：
#   develop 分支 → 自动构建 + 部署测试环境
#   main 分支   → 自动构建 + 手动审批部署生产环境
# ==========================================

name: Deploy

on:
  push:
    branches: [develop, main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_BACKEND: ${{ github.repository }}/xbb-backend
  IMAGE_NAME_FRONTEND: ${{ github.repository }}/xbb-frontend

jobs:
  # ==========================================
  # 构建后端镜像
  # ==========================================
  build-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: 登录 ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 设置 BuildKit
        uses: docker/setup-buildx-action@v3

      - name: 构建并推送后端镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: my-nest-app/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================================
  # 构建前端镜像
  # ==========================================
  build-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: 登录 ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 设置 BuildKit
        uses: docker/setup-buildx-action@v3

      - name: 构建并推送前端镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: my-vue-app/Dockerfile
          push: true
          build-args: |
            VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_FRONTEND }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_FRONTEND }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================================
  # 部署测试环境（develop 分支 → 自动触发）
  # ==========================================
  # 需要在内网测试服务器上安装 GitHub self-hosted runner：
  #   1. GitHub → Settings → Actions → Runners → New self-hosted runner
  #   2. 在测试服务器上执行安装命令
  #   3. 给 runner 打上标签：self-hosted, test
  # 暂时可手动部署：
  #   docker pull ghcr.io/rossroma/xbb-website/xbb-backend:latest
  #   docker pull ghcr.io/rossroma/xbb-website/xbb-frontend:latest
  #   bash deploy.test.sh
  # ==========================================
  deploy-test:
    if: github.ref == 'refs/heads/develop'
    needs: [build-backend, build-frontend]
    runs-on: [self-hosted, test]
    steps:
      - uses: actions/checkout@v4

      - name: 登录 ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 执行部署脚本
        run: |
          chmod +x deploy.test.sh
          DB_PASSWORD="${{ secrets.TEST_DB_PASSWORD }}" \
          DB_DATABASE="${{ secrets.TEST_DB_DATABASE }}" \
          JWT_SECRET="${{ secrets.TEST_JWT_SECRET }}" \
          DEPLOY_PATH="${{ secrets.TEST_DEPLOY_PATH }}" \
          bash deploy.test.sh

  # ==========================================
  # 部署生产环境（main 分支 → 手动审批）
  # TODO: 生产环境如需迁移到 ghcr.io，更新 deploy.sh 和 docker-compose.yml 后启用
  # ==========================================