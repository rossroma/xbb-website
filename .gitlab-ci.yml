# ==========================================
# 销帮帮 CRM 官网 — GitLab CI/CD 部署流水线
# ==========================================
# 触发规则：
#   develop 分支  → 自动部署测试环境（Docker MySQL + SSH 管道传输镜像）
#   main 分支 → 手动触发生产环境（阿里云 RDS + ACR 镜像分发）
# ==========================================

stages:
  - build
  - deploy-test
  - deploy-prod

# ==========================================
# 构建后端镜像（main 分支 → 推送 ACR）
# ==========================================
build-backend:
  stage: build
  image: docker:27-dind
  services:
    - docker:27-dind
  only:
    - main
  before_script:
    - echo "${ACR_PASSWORD}" | docker login --username "${ACR_USERNAME}" --password-stdin "${ACR_REGISTRY}"
  script:
    - docker build -f my-nest-app/Dockerfile -t ${ACR_REGISTRY}/${ACR_NAMESPACE}/xbb-backend:${CI_COMMIT_SHORT_SHA} -t ${ACR_REGISTRY}/${ACR_NAMESPACE}/xbb-backend:latest .
    - docker push ${ACR_REGISTRY}/${ACR_NAMESPACE}/xbb-backend:${CI_COMMIT_SHORT_SHA}
    - docker push ${ACR_REGISTRY}/${ACR_NAMESPACE}/xbb-backend:latest
  tags:
    - docker

# ==========================================
# 构建前端镜像（main 分支 → 推送 ACR）
# ==========================================
build-frontend:
  stage: build
  image: docker:27-dind
  services:
    - docker:27-dind
  only:
    - main
  before_script:
    - echo "${ACR_PASSWORD}" | docker login --username "${ACR_USERNAME}" --password-stdin "${ACR_REGISTRY}"
  script:
    - docker build -f my-vue-app/Dockerfile --build-arg VITE_API_BASE_URL="${VITE_API_BASE_URL:-}" -t ${ACR_REGISTRY}/${ACR_NAMESPACE}/xbb-frontend:${CI_COMMIT_SHORT_SHA} -t ${ACR_REGISTRY}/${ACR_NAMESPACE}/xbb-frontend:latest .
    - docker push ${ACR_REGISTRY}/${ACR_NAMESPACE}/xbb-frontend:${CI_COMMIT_SHORT_SHA}
    - docker push ${ACR_REGISTRY}/${ACR_NAMESPACE}/xbb-frontend:latest
  tags:
    - docker

# ==========================================
# 构建测试镜像（develop 分支 → 导出 tar）
# ==========================================
build-test:
  stage: build
  image: docker:27-dind
  services:
    - docker:27-dind
  only:
    - develop
  script:
    # 构建后端
    - docker build -f my-nest-app/Dockerfile -t xbb-backend:latest .
    - docker save xbb-backend:latest | gzip > xbb-backend.tar.gz
    # 构建前端（传入测试环境 API 地址）
    - docker build -f my-vue-app/Dockerfile --build-arg VITE_API_BASE_URL="${TEST_VITE_API_BASE_URL}" -t xbb-frontend:latest .
    - docker save xbb-frontend:latest | gzip > xbb-frontend.tar.gz
  artifacts:
    name: "xbb-images-${CI_COMMIT_SHORT_SHA}"
    paths:
      - xbb-backend.tar.gz
      - xbb-frontend.tar.gz
    expire_in: 1 day
  tags:
    - docker

# ==========================================
# 部署测试环境（develop 分支 → 自动触发）
# ==========================================
deploy-test:
  stage: deploy-test
  image: alpine:latest
  only:
    - develop
  dependencies:
    - build-test
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - echo "${TEST_SSH_KNOWN_HOSTS}" > ~/.ssh/known_hosts
    - echo "${TEST_SSH_PRIVATE_KEY}" > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
  script:
    # 上传文件到测试服务器
    - scp -P ${TEST_DEPLOY_PORT:-22} docker-compose.test.yml ${TEST_DEPLOY_USER}@${TEST_DEPLOY_HOST}:${TEST_DEPLOY_PATH}/
    - scp -P ${TEST_DEPLOY_PORT:-22} deploy.test.sh ${TEST_DEPLOY_USER}@${TEST_DEPLOY_HOST}:${TEST_DEPLOY_PATH}/
    - ssh ${TEST_DEPLOY_USER}@${TEST_DEPLOY_HOST} -p ${TEST_DEPLOY_PORT:-22} "mkdir -p ${TEST_DEPLOY_PATH}/images"
    - scp -P ${TEST_DEPLOY_PORT:-22} xbb-backend.tar.gz ${TEST_DEPLOY_USER}@${TEST_DEPLOY_HOST}:${TEST_DEPLOY_PATH}/images/
    - scp -P ${TEST_DEPLOY_PORT:-22} xbb-frontend.tar.gz ${TEST_DEPLOY_USER}@${TEST_DEPLOY_HOST}:${TEST_DEPLOY_PATH}/images/
    # 远程执行：解压镜像 → 加载 → 部署
    - |
      ssh ${TEST_DEPLOY_USER}@${TEST_DEPLOY_HOST} -p ${TEST_DEPLOY_PORT:-22} bash -s << 'REMOTE_SCRIPT'
      set -e
      cd ${TEST_DEPLOY_PATH}
      # 解压镜像
      gunzip -c images/xbb-backend.tar.gz > images/xbb-backend.tar
      gunzip -c images/xbb-frontend.tar.gz > images/xbb-frontend.tar
      # 执行部署
      chmod +x deploy.test.sh
      DB_PASSWORD="${TEST_DB_PASSWORD}" \
      DB_DATABASE="${TEST_DB_DATABASE}" \
      JWT_SECRET="${TEST_JWT_SECRET}" \
      DEPLOY_PATH="${TEST_DEPLOY_PATH}" \
      bash deploy.test.sh
      REMOTE_SCRIPT

# ==========================================
# 部署生产环境（main 分支 → 手动触发）
# ==========================================
deploy-prod:
  stage: deploy-prod
  image: alpine:latest
  only:
    - main
  when: manual
  needs:
    - build-backend
    - build-frontend
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - echo "${SSH_KNOWN_HOSTS}" > ~/.ssh/known_hosts
    - echo "${SSH_PRIVATE_KEY}" > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
  script:
    # 上传 compose 文件和部署脚本
    - scp -P ${DEPLOY_PORT:-22} docker-compose.yml ${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/
    - scp -P ${DEPLOY_PORT:-22} deploy.sh ${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/
    # 远程执行部署
    - |
      ssh ${DEPLOY_USER}@${DEPLOY_HOST} -p ${DEPLOY_PORT:-22} bash -s << 'REMOTE_SCRIPT'
      set -e
      cd ${DEPLOY_PATH}
      chmod +x deploy.sh
      ACR_REGISTRY="${ACR_REGISTRY}" \
      ACR_NAMESPACE="${ACR_NAMESPACE}" \
      ACR_USERNAME="${ACR_USERNAME}" \
      ACR_PASSWORD="${ACR_PASSWORD}" \
      DB_HOST="${DB_HOST}" \
      DB_PORT="${DB_PORT}" \
      DB_USERNAME="${DB_USERNAME}" \
      DB_PASSWORD="${DB_PASSWORD}" \
      DB_DATABASE="${DB_DATABASE}" \
      JWT_SECRET="${JWT_SECRET}" \
      JWT_EXPIRES_IN="${JWT_EXPIRES_IN}" \
      DEPLOY_PATH="${DEPLOY_PATH}" \
      bash deploy.sh
      REMOTE_SCRIPT