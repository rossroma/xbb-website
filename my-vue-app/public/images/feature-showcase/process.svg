<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 180" fill="none">
  <defs>
    <linearGradient id="tealGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5ee3c4"/>
      <stop offset="100%" stop-color="#0ea5a9"/>
    </linearGradient>
    <linearGradient id="tealLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4f7f0"/>
      <stop offset="100%" stop-color="#b8f0e5"/>
    </linearGradient>
    <linearGradient id="dangerGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fca5a5"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="successGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
  </defs>
  <!-- 流程步骤连线 -->
  <line x1="56" y1="52" x2="56" y2="130" stroke="#0ea5a9" stroke-width="2" stroke-dasharray="4 4" opacity="0.2"/>
  <!-- 步骤 1 - 已完成 -->
  <circle cx="56" cy="52" r="12" fill="url(#tealLight)"/>
  <circle cx="56" cy="52" r="5" fill="url(#tealGrad)"/>
  <rect x="82" y="40" width="160" height="24" rx="6" fill="white" stroke="#d4f7f0" stroke-width="1"/>
  <rect x="82" y="44" width="80" height="6" rx="3" fill="#0ea5a9" opacity="0.6"/>
  <rect x="82" y="54" width="120" height="5" rx="2.5" fill="#0ea5a9" opacity="0.2"/>
  <!-- 右侧标签 - 已完成 -->
  <rect x="222" y="44" width="36" height="16" rx="8" fill="url(#tealGrad)"/>
  <text x="240" y="55" text-anchor="middle" fill="white" font-size="8" font-weight="600">完成</text>
  <!-- 步骤 2 - 有风险 -->
  <circle cx="56" cy="92" r="12" fill="#fef2f2"/>
  <circle cx="56" cy="92" r="5" fill="url(#dangerGrad)"/>
  <rect x="82" y="80" width="160" height="24" rx="6" fill="white" stroke="#fecaca" stroke-width="1"/>
  <rect x="82" y="84" width="90" height="6" rx="3" fill="#ef4444" opacity="0.6"/>
  <rect x="82" y="94" width="110" height="5" rx="2.5" fill="#ef4444" opacity="0.2"/>
  <!-- 右侧标签 - 有风险 -->
  <rect x="222" y="84" width="36" height="16" rx="8" fill="url(#dangerGrad)"/>
  <text x="240" y="95" text-anchor="middle" fill="white" font-size="8" font-weight="600">有风险</text>
  <!-- 步骤 3 - 进行中 -->
  <circle cx="56" cy="132" r="12" fill="url(#tealLight)"/>
  <circle cx="56" cy="132" r="5" fill="url(#tealGrad)" opacity="0.7"/>
  <rect x="82" y="120" width="160" height="24" rx="6" fill="white" stroke="#d4f7f0" stroke-width="0.5"/>
  <rect x="82" y="124" width="75" height="6" rx="3" fill="#0ea5a9" opacity="0.4"/>
  <rect x="82" y="134" width="100" height="5" rx="2.5" fill="#0ea5a9" opacity="0.15"/>
  <!-- 右侧标签 - 进行中 -->
  <rect x="222" y="124" width="36" height="16" rx="8" fill="#0ea5a9" opacity="0.3"/>
  <text x="240" y="135" text-anchor="middle" fill="#0ea5a9" font-size="8" font-weight="600">进行中</text>
</svg>