<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 180" fill="none">
  <defs>
    <linearGradient id="purpleGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b78bff"/>
      <stop offset="100%" stop-color="#7c5cff"/>
    </linearGradient>
    <linearGradient id="purpleLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ede6ff"/>
      <stop offset="100%" stop-color="#e0d5ff"/>
    </linearGradient>
  </defs>
  <!-- AI 头像 -->
  <circle cx="40" cy="42" r="14" fill="url(#purpleGrad)"/>
  <text x="40" y="46" text-anchor="middle" fill="white" font-size="11" font-weight="700">AI</text>
  <!-- 对话气泡 1（AI 左） -->
  <rect x="62" y="28" width="132" height="28" rx="12" fill="#ede6ff"/>
  <rect x="70" y="36" width="80" height="6" rx="3" fill="#7c5cff" opacity="0.5"/>
  <rect x="70" y="46" width="55" height="5" rx="2.5" fill="#7c5cff" opacity="0.25"/>
  <!-- 对话气泡 2（用户 右） -->
  <rect x="116" y="64" width="140" height="28" rx="12" fill="url(#purpleGrad)"/>
  <rect x="124" y="72" width="90" height="6" rx="3" fill="white" opacity="0.7"/>
  <rect x="124" y="82" width="65" height="5" rx="2.5" fill="white" opacity="0.4"/>
  <!-- 用户头像 -->
  <circle cx="242" cy="78" r="10" fill="#e0d5ff"/>
  <circle cx="242" cy="78" r="4" fill="#7c5cff"/>
  <!-- 对话气泡 3（AI 左） -->
  <rect x="62" y="100" width="148" height="28" rx="12" fill="#ede6ff"/>
  <rect x="70" y="108" width="100" height="6" rx="3" fill="#7c5cff" opacity="0.5"/>
  <rect x="70" y="118" width="70" height="5" rx="2.5" fill="#7c5cff" opacity="0.25"/>
  <!-- AI 对话气泡 4（建议卡片） -->
  <rect x="62" y="134" width="180" height="36" rx="10" fill="white" stroke="#e0d5ff" stroke-width="1"/>
  <rect x="72" y="142" width="50" height="20" rx="6" fill="url(#purpleGrad)"/>
  <text x="97" y="155" text-anchor="middle" fill="white" font-size="8" font-weight="600">话术建议</text>
  <rect x="128" y="144" width="100" height="6" rx="3" fill="#7c5cff" opacity="0.4"/>
  <rect x="128" y="154" width="70" height="5" rx="2.5" fill="#7c5cff" opacity="0.2"/>
  <!-- 星星装饰 -->
  <text x="202" y="36" font-size="12" fill="#b78bff" opacity="0.4">✦</text>
  <text x="16" y="76" font-size="10" fill="#7c5cff" opacity="0.3">✦</text>
</svg>