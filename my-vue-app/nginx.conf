worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for"';

  access_log /var/log/nginx/access.log main;

  sendfile        on;
  tcp_nopush      on;
  tcp_nodelay     on;
  keepalive_timeout 65;

  # ==========================================
  # gzip 压缩
  # ==========================================
  gzip on;
  gzip_vary on;
  gzip_min_length 1000;
  gzip_comp_level 6;
  gzip_types
    text/plain
    text/css
    text/javascript
    text/xml
    application/json
    application/javascript
    application/xml+rss
    application/x-font-ttf
    image/svg+xml;

  # ==========================================
  # 爬虫 UA 检测（用于动态路由 SSR 分流）
  # ==========================================
  map $http_user_agent $is_crawler {
    default 0;
    "~*bot" 1;
    "~*Baiduspider" 1;
    "~*Googlebot" 1;
    "~*bingbot" 1;
    "~*Sogou" 1;
    "~*360Spider" 1;
    "~*YisouSpider" 1;
    "~*Bytespider" 1;
    "~*Twitterbot" 1;
    "~*facebookexternalhit" 1;
    "~*Slurp" 1;
    "~*DuckDuckBot" 1;
  }

  server {
    listen 80;
    server_name _;

    # ==========================================
    # 安全头
    # ==========================================
    add_header X-Frame-Options         "SAMEORIGIN" always;
    add_header X-Content-Type-Options  "nosniff"    always;
    add_header X-XSS-Protection        "1; mode=block" always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://hm.baidu.com; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:; font-src 'self' data:; connect-src 'self' https://hm.baidu.com; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;

    # ==========================================
    # 历史上传文件（本地磁盘，非 OSS）
    # ==========================================
    location /Uploads/ {
      root /usr/share/nginx/html;
      expires 30d;
      add_header Cache-Control "public, max-age=2592000";
    }

    # ==========================================
    # 静态资源缓存（Vite 打包带哈希，长期缓存）
    # ==========================================
    location /assets/ {
      root /usr/share/nginx/html;
      expires 1y;
      add_header Cache-Control "public, immutable";
    }

    # ==========================================
    # HTML 不缓存（确保新版本立即生效）
    # ==========================================
    location = /index.html {
      root /usr/share/nginx/html;
      add_header Cache-Control "no-cache, must-revalidate";
    }

    location = /admin.html {
      root /usr/share/nginx/html;
      add_header Cache-Control "no-cache, must-revalidate";
    }

    # ==========================================
    # 管理后台 SPA 路由
    # ==========================================
    location = /admin {
      return 301 /admin/;
    }

    location /admin/ {
      root /usr/share/nginx/html;
      try_files $uri $uri/ /admin.html;
    }

    # ==========================================
    # API 反向代理 → 后端
    # ==========================================
    location /v1/ {
      proxy_pass http://backend:3000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ==========================================
    # 动态路由 SSR 分流（爬虫 → 后端渲染，浏览器 → SPA）
    # ==========================================
    location ~ ^/(gongsidongtai|hangyeanli|zhishiwenda)/.+$ {
      # 爬虫：代理到后端 SSR 端点
      if ($is_crawler = 1) {
        rewrite ^ /v1/ssr$request_uri break;
        proxy_pass http://backend:3000;
      }
      # 浏览器：SPA 兜底
      try_files $uri $uri/ /index.html;
    }

    # ==========================================
    # robots.txt / sitemap.xml
    # ==========================================
    location = /robots.txt {
        root /usr/share/nginx/html;
        add_header Content-Type "text/plain; charset=utf-8";
    }

    location = /sitemap.xml {
        root /usr/share/nginx/html;
        add_header Content-Type "application/xml; charset=utf-8";
    }

    # ==========================================
    # 客户端前台 SPA 路由（兜底）
    # $uri.html 匹配 vite-ssg 输出的扁平 HTML 文件
    # ==========================================
    location / {
      root /usr/share/nginx/html;
      try_files $uri $uri/ $uri.html /index.html;
    }
  }
}